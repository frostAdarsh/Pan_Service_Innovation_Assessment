version: '3.8'

services:
  # BACKEND (FastAPI)
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_qa_backend
    ports:
      - "8000:8000"  
    env_file:
      - .env
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  
  # FRONTEND  (React )
 
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_qa_frontend
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:   
      - VITE_API_URL=http://localhost:8000
    volumes: 
      - ./frontend:/app  
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend
    restart: unless-stopped