name: CI Pipeline
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
 
  # BACKEND TESTING & COVERAGE (FastAPI)
  
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          # Installs your app packages plus testing tools
          pip install fastapi uvicorn motor python-dotenv groq python-multipart
          pip install pytest pytest-cov httpx pytest-asyncio

      - name: Run Pytest with 95% Coverage
        working-directory: ./backend
        
        env:
          PYTHONPATH: .               
          ENVIRONMENT: testing
          MONGO_URI: mongomock://localhost
          DB_NAME: test_db
          GROQ_API_KEY: test_dummy_key
        run: |
          # This command enforces the 95% requirement. 
          # If coverage drops to 94%, the GitHub Action will fail.
          pytest --cov=app --cov-report=term-missing --cov-fail-under=95

 
  # FRONTEND BUILD VALIDATION (React)

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20      
        uses: actions/setup-node@v4
        with:
          node-version: "20"         

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Verify React Build
        working-directory: ./frontend
        
        run: npm run build